name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0" ruff mypy bandit pip-audit build twine
      - run: python -m pip install -e .
      - run: ruff check .
      - run: mypy src
      - run: bandit -q -r src
      - run: pip-audit
      - run: python -m build
      - run: twine check dist/*

  contextbridge-actions-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out actions adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned public ContextBridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IamAngusU/ContextBridge
          ref: 8b342da3007a42ef0fe34f337024e84440ec5fd9
          path: .conformance/contextbridge
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - run: python -m pip install -e .
      - name: Build public Core and prove the mutation boundary without provider traffic
        shell: bash
        run: |
          mkdir -p .conformance/bin
          (cd .conformance/contextbridge && go build -o ../bin/contextbridge ./cmd/contextbridge)
          CB_TEST_CORE_BINARY="${{ github.workspace }}/.conformance/bin/contextbridge" \
            python -m unittest discover -s tests -p 'test_public_core.py' -v
